[project]
name = "kastgat"
version = "0.1.0"
description = "Knowledge-Aware Spatial-Temporal Graph Attention Network starter kit for the Engage 2 ATM hackathon."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lightning>=2.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydeck>=0.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "streamlit>=1.38",
    "torch>=2.5",
    "torch-geometric>=2.6",
]

[project.optional-dependencies]
opensky = ["pyopensky>=2.16", "traffic>=2.13"]
bluesky = ["bluesky-simulator>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kastgat-train = "kastgat.train.cli:main"
kastgat-pipeline = "kastgat.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kastgat"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
